<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoeWallpaper</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <!-- 顶部：图源选择 + 搜索 -->
      <header class="toolbar">
        <h1>MoeWallpaper</h1>
        <select id="source-select" disabled>
          <option value="">载入图源中…</option>
        </select>
        <input
          id="search-input"
          type="search"
          placeholder="搜索关键词…"
          disabled
          aria-label="搜索壁纸"
        />
        <select id="res-select" class="filter-select" aria-label="最低分辨率" title="最低分辨率">
          <option value="any">全部分辨率</option>
          <option value="fhd" title="1920×1080 及以上">≥ 1080p</option>
          <option value="qhd" title="2560×1440 及以上">≥ 1440p</option>
          <option value="uhd" title="3840×2160 及以上">≥ 4K</option>
        </select>
        <select id="ratio-select" class="filter-select" aria-label="图片比例" title="按屏幕形状筛：显示器是横屏，手机是竖屏">
          <option value="any">任意比例</option>
          <option value="desktop" title="宽高比 ≥ 1.6：1920×1080、1920×1200、3440×1440 等">显示器（宽屏）</option>
          <option value="tablet" title="宽高比 1.15~1.6 或 0.62~0.87：2048×1536、3000×2000 等">平板（4:3）</option>
          <option value="phone" title="宽高比 &lt; 0.62：1080×1920、1080×2400、1440×3200 等">手机（竖屏）</option>
        </select>
        <button id="sources-btn" class="icon-btn" type="button" aria-label="图源管理" title="图源管理（接入自己的 API）">🧩</button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换主题">🌙</button>
      </header>

      <!-- 图源内容提示（如"尺度较大"）。图源没声明 contentNote 时整个隐藏 -->
      <p id="source-note" class="source-note" hidden></p>

      <!-- 状态提示条（加载中 / 空 / 出错） -->
      <p id="status" class="status">载入中…</p>

      <!-- 缩略图网格 -->
      <div id="grid" class="grid"></div>

      <!-- 翻页。没有它一页只有 20 来张，后面的图永远看不到 -->
      <nav class="pager" aria-label="翻页">
        <button id="prev-page" class="pager-btn" type="button" disabled>← 上一页</button>
        <span id="page-label" class="pager-label">第 1 页</span>
        <button id="next-page" class="pager-btn" type="button" disabled>下一页 →</button>
      </nav>

      <!-- 操作反馈 toast -->
      <div id="toast" class="toast" hidden></div>

      <!--
        图源管理面板（v0.2.0：用户接入自己的 API）。
        放静态标记而不是 JS 里拼 innerHTML：这块有链接、有文件选择框，
        写在 HTML 里能被读到、能被审查，出问题也一眼看得出结构。
      -->
      <div id="sources-overlay" class="panel-overlay" hidden>
        <div class="panel-backdrop" data-action="close-sources"></div>
        <section class="panel" role="dialog" aria-modal="true" aria-labelledby="sources-title">
          <header class="panel-head">
            <h2 id="sources-title">图源</h2>
            <button class="panel-close" type="button" data-action="close-sources" aria-label="关闭" title="关闭 (Esc)">×</button>
          </header>

          <p class="panel-lead">
            把图源配置（<code>.json</code>）放进下面这个文件夹，点「重新加载」就会出现在
            图源下拉框里。字段说明见
            <a id="sources-doc" href="https://github.com/Remblued/MoeWallpaper/blob/main/docs/CUSTOM-SOURCES.md" target="_blank" rel="noopener">docs/CUSTOM-SOURCES.md</a>。
          </p>

          <p class="panel-path"><code id="sources-folder">（未知）</code></p>

          <div class="panel-actions">
            <button id="sources-open" class="panel-btn" type="button">打开文件夹</button>
            <button id="sources-reload" class="panel-btn" type="button">重新加载</button>
            <button id="sources-import" class="panel-btn" type="button">导入 .json…</button>
            <button id="sources-example" class="panel-btn" type="button">生成示例配置</button>
            <input id="sources-file" type="file" accept=".json,application/json" hidden />
          </div>

          <p id="sources-summary" class="panel-summary"></p>
          <ul id="sources-problems" class="panel-problems"></ul>
        </section>
      </div>
    </main>
  </body>
</html>
