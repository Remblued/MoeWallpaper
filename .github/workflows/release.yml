# 发布构建（手动触发）。为什么要有这个工作流：SignPath 只签"由 GitHub 工作流构建、
# 并且先作为 workflow artifact 存过"的产物——本地 `npm run tauri build` 出来的 exe 它不签。
#
# 现在还没有 SignPath 的 token/项目，所以签名那一步用 `vars.SIGNPATH_PROJECT_SLUG != ''`
# 挡住了：没配置时整个签名与"上传签名产物"的分支都不执行，只做"构建 + 附加到 Release"。
#
# 手动触发（本机或网页 Actions 页面都可）：
#   gh workflow run release.yml -f tag=v0.1.2      （或网页上 Run workflow）
# 它会：
#   1. 按 tag 检出源码
#   2. windows-latest 上 npm ci + npx tauri build（等价于本地那套 LTO 构建）
#   3. 把 NSIS 安装包作为 artifact 上传（SignPath 要求先有 artifact 才肯签）
#   4. （若配置了 SignPath）提交签名请求，取回已签名的产物
#   5. 计算 SHA-256，用 gh 附加到同名 Release（--clobber，可重复跑）
#
# 注意：签名会**改变文件字节**，所以签名后的 SHA-256 和本地未签名构建不一样。
# 每次签名发布后必须重新记录哈希（README / docs/BENCHMARK.md / Release 说明）。

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（例如 v0.1.2）'
        required: true
        type: string
      attach_to_release:
        description: '把产物附加到同名 Release'
        required: false
        default: true
        type: boolean

# contents: write 用于上传 Release 资产；actions: read 是 SignPath 动作读取 job/artifact 需要
permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer
    # SignPath 的开源策略要求所有 job 都跑在 GitHub 托管 runner 上——别改成自托管
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      # beforeBuildCommand 会自己跑 `npm run build`（tsc && vite build）
      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - name: List the bundle
        run: Get-ChildItem src-tauri\target\release\bundle\nsis

      # SignPath 要求产物先作为 workflow artifact 存在。
      # 默认存成 ZIP：Artifact Configuration 的根元素要用 <zip-file>。
      - name: Upload unsigned installer
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 只有配置了 SignPath 的 vars 才会走这一步（见 docs/SIGNPATH.md）
      - name: Submit signing request
        id: sign
        if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # 签名后从 signed/ 里取，未签名时回退到 bundle 目录
      - name: Collect final installer + SHA-256
        id: collect
        shell: pwsh
        run: |
          $signed = 'signed'
          $from = if (Test-Path $signed) { Get-ChildItem $signed -Recurse -Filter '*.exe' } else { Get-ChildItem 'src-tauri\target\release\bundle\nsis' -Filter '*.exe' }
          $src = @($from) | Sort-Object Length -Descending | Select-Object -First 1
          $dir = Join-Path $PWD 'dist-out'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dest = Join-Path $dir $src.Name
          Copy-Item $src.FullName $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash
          "$hash  $($src.Name)" | Set-Content (Join-Path $dir ($src.Name + '.sha256')) -Encoding ascii
          $sig = Get-AuthenticodeSignature $dest
          "signed=$($sig.Status)"
          "file=$dest"
          "sha256=$hash"
          "name=$($src.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "sigstatus=$($sig.Status)" >> $env:GITHUB_OUTPUT

      - name: Upload final installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist-out/*
          if-no-files-found: error

      - name: Attach to release
        if: ${{ inputs.attach_to_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view '${{ inputs.tag }}' --repo '${{ github.repository }}' | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ inputs.tag }}' --repo '${{ github.repository }}' --title '${{ inputs.tag }}' --generate-notes
          }
          $files = @(Get-ChildItem 'dist-out' -File | ForEach-Object { $_.FullName })
          "uploading: $($files -join ', ')"
          gh release upload '${{ inputs.tag }}' @files --repo '${{ github.repository }}' --clobber

      - name: Summary
        shell: pwsh
        run: |
          "Tag        : ${{ inputs.tag }}"
          "Installer  : ${{ steps.collect.outputs.name }}"
          "SHA-256    : ${{ steps.collect.outputs.sha256 }}"
          "Signature  : ${{ steps.collect.outputs.sigstatus }}"
          "Signing on : ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}"
